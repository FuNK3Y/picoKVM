name: Firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["hardware/**", "esphome/**"]
  pull_request:
    paths-ignore: ["hardware/**", "esphome/**"]
  workflow_dispatch:

permissions:
  contents: write  # Publishing the release of a tag
  pages: write  # Publishing the installer of a tag
  id-token: write  # Required by actions/deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2  # The ESP-IDF version firmware/build.sh's MicroPython supports
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Tags, for the version (git describe)

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"  # The container runs as another user than the checkout
          command -v gcc || (apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev)  # mpy-cross
          . "$IDF_PATH/export.sh"
          firmware/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            firmware/build/firmware.bin
            firmware/build/firmware-ota.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            firmware/build/firmware.bin
            firmware/build/firmware-ota.bin

      - name: Installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |  # install/index.html, with the release's image and its ESP Web Tools manifest
          mkdir -p firmware/build/pages
          cp install/index.html firmware/build/firmware.bin firmware/build/pages/
          cat > firmware/build/pages/manifest.json <<EOF
          {
            "name": "picoKVM",
            "version": "${GITHUB_REF_NAME}",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 15,
            "builds": [{"chipFamily": "ESP32-S3", "parts": [{"path": "firmware.bin", "offset": 0}]}]
          }
          EOF

      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: firmware/build/pages

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
