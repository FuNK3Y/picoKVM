# picoKVM board (hardware/README.md) running ESPHome instead of the MicroPython firmware.
# The picokvm select switches USB and the DDC/CI monitors; everything else is stock ESPHome.
# Flash over the AUX USB-C:  esphome run picokvm.yaml

substitutions:
  name: picokvm
  input_a: USB A
  input_b: USB B

esphome:
  name: ${name}

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: quad

external_components:
  - source: github://FuNK3Y/picoKVM
    components: [picokvm]
  # Working copy instead: - source: { type: local, path: components }

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# HDMI 1 and HDMI 2 DDC lines. DDC/CI allows up to 100 kHz; 50 kHz leaves margin for long cables
i2c:
  - id: hdmi1
    sda: GPIO1
    scl: GPIO2
    frequency: 50kHz
  - id: hdmi2
    sda: GPIO4
    scl: GPIO5
    frequency: 50kHz

select:
  - platform: picokvm
    id: kvm_input
    name: Input
    options: ["${input_a}", "${input_b}"]
    # The monitor must accept DDC/CI on an inactive input (README.md, DDC/CI)
    monitors:
      - i2c_id: hdmi1
        inputs: [0x0F, 0x11]  # VCP 0x60 for USB A, USB B: here DisplayPort 1, HDMI 1
      - i2c_id: hdmi2
        inputs: [0x0F, 0x11]
        # power_on: true      # VCP 0xD6 = on first, then the input after power_on_delay
    on_value:
      - light.turn_on:
          id: board_led
          <<: &input_color  # Input colors, as in config.py: A #007BFF, B #902A8D
            red: !lambda "return i == 0 ? 0.0f : 0.565f;"
            green: !lambda "return i == 0 ? 0.482f : 0.165f;"
            blue: !lambda "return i == 0 ? 1.0f : 0.553f;"
            brightness: 20%
      - light.turn_on:
          id: key_led
          <<: *input_color

binary_sensor:
  - platform: gpio
    id: key
    name: Key
    pin:
      number: GPIO13  # On-board SW3 and the Grove J8 key; 10k pull-up on the board
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - select.next:
          id: kvm_input
          cycle: true
  - platform: gpio
    name: USB A powered
    pin: GPIO11
    device_class: power
  - platform: gpio
    name: USB B powered
    pin: GPIO12
    device_class: power
  - platform: gpio
    name: Peripheral port fault
    pin:
      number: GPIO16
      inverted: true
    device_class: problem

light:
  - platform: esp32_rmt_led_strip
    id: board_led
    name: Board LED
    pin: GPIO14
    chipset: SK6812
    channel_colors: GRB
    num_leds: 1
  - platform: esp32_rmt_led_strip
    id: key_led
    name: Key LED
    pin: GPIO17
    chipset: SK6812
    channel_colors: GRB
    num_leds: 1
